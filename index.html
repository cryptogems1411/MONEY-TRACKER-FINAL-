<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2b2e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{--bg:#e9f1ef;--card:#fff;--ink:#0c2b2e;--mute:#5b7476;--line:#d3e0dd;--ok:#0f766e;--warn:#c27a12;--bad:#c4382d;--hero:#0c2b2e;--heroInk:#e9f7f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1718;--card:#122426;--ink:#e6f3f0;--mute:#8fabab;--line:#21393b;--ok:#3fc1b0;--warn:#e3a53f;--bad:#ef6b5f;--hero:#0f766e;--heroInk:#f2fffb;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1718;--card:#122426;--ink:#e6f3f0;--mute:#8fabab;--line:#21393b;--ok:#3fc1b0;--warn:#e3a53f;--bad:#ef6b5f;--hero:#0f766e;--heroInk:#f2fffb;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,-apple-system,system-ui,sans-serif;line-height:1.45}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.hero{background:var(--hero);color:var(--heroInk);border-radius:22px;padding:22px 20px;margin-top:14px}
.hero small{opacity:.8;font-size:13px}
.big{font-size:52px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:4px 0 6px}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(255,255,255,.16)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
h2{font-size:16px;margin:0 0 12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.mute{color:var(--mute);font-size:13px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
input,select{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add .full{grid-column:1/-1}
button{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:12px;padding:13px;background:var(--ok);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.x{background:none;color:var(--mute);padding:4px 8px;font-size:18px}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.chk{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.chk input{width:24px;height:24px;accent-color:var(--ok);flex:none}
.over{color:var(--bad)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 4px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.cat span{font-size:28px;line-height:1}
.cat.sel{border-color:var(--ok);background:var(--card);box-shadow:0 0 0 2px var(--ok) inset}
.lg{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.dot{width:14px;height:14px;border-radius:4px;flex:none}
.lg b{flex:1;font-weight:600}
.verdict{margin-top:12px;padding:12px;border-radius:12px;font-weight:700;font-size:15px;text-align:center;background:var(--bg)}
label.lab{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld{margin-bottom:14px}.fld input{margin-top:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:9px;font-size:14px}
.tab.sel{border-color:var(--ok)}
.dn{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.dn svg{width:190px;height:190px;flex:none}
.dn .leg{flex:1;min-width:160px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var KEY='money_dash_v2',S={income:0,loan:0,needs:0,fuel:0,fun:0,ef:0,efGoal:0,cust:{},cycles:{}},view='plan';
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fmt(n){return 'Rs '+Math.round(n).toLocaleString('en-US')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cycle(){
  var t=new Date(),d=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var start=d.getDate()>=26?new Date(d.getFullYear(),d.getMonth(),26):new Date(d.getFullYear(),d.getMonth()-1,26);
  var end=new Date(start.getFullYear(),start.getMonth()+1,25);
  var left=Math.max(1,Math.round((end-d)/864e5)+1);
  var key=start.getFullYear()+'-'+(start.getMonth()+1);
  if(!S.cycles[key])S.cycles[key]={exp:[],chk:{}};
  return {key:key,left:left,c:S.cycles[key]};
}
var CATS=[['Groceries','🛒','Needs'],['Health','💊','Needs'],['School','🎒','Needs'],['Other','➕','Needs'],['Fuel','⛽','Fuel'],['Restaurant','🍽️','Fun'],['Coffee & snacks','☕','Fun'],['Entertainment','🎬','Fun'],['Shopping','🛍️','Fun'],['Gym','🏋️','Fun'],['Gift','🎁','Fun']];
var selCat=0;
var F=[['income','Income (monthly salary)',[20000,30000,35000,40000,45000,50000]],
['loan','Loan payment',[5000,5500,6000,6500,7000,7500,8000,8500,9000]],
['needs','Needs budget (groceries, health, school…)',[5000,7500,10000,12500,15000,17500,20000]],
['fuel','Fuel & transport budget',[1000,1500,2000,2500,3000,3500,4000,5000]],
['fun','Fun budget',[500,1000,1500,2000,3000,4000,5000]]];
function spent(c,g){return c.exp.filter(function(e){return (e.grp||e.cat)===g}).reduce(function(a,e){return a+e.amt},0)}
function icon(n){var r=CATS.filter(function(x){return x[0]===n})[0];return r?r[1]:'•'}
function catGrid(){return CATS.map(function(x,i){return '<button class="cat'+(i===selCat?' sel':'')+'" onclick="pick('+i+')"><span>'+x[1]+'</span>'+esc(x[0])+'</button>'}).join('')}
function pick(i){selCat=i;var b=document.querySelectorAll('.cat');for(var k=0;k<b.length;k++){b[k].classList.toggle('sel',k===i)}}
function field(f){
  var k=f[0],v=S[k]||0,pr=f[2],other=S.cust[k]||(v>0&&pr.indexOf(v)<0);
  var o='<option value="0"'+(!other&&!v?' selected':'')+'>Select amount</option>'+pr.map(function(p){return '<option value="'+p+'"'+(!other&&p===v?' selected':'')+'>'+fmt(p)+'</option>'}).join('')+'<option value="other"'+(other?' selected':'')+'>Other (write my own)</option>';
  return '<div class="fld"><label class="lab" for="f_'+k+'">'+f[1]+'</label><select id="f_'+k+'" onchange="setField(\''+k+'\',this.value)">'+o+'</select>'+(other?'<input type="number" inputmode="numeric" min="0" placeholder="Write your amount (Rs)" value="'+(v||'')+'" onchange="setCustom(\''+k+'\',this.value)">':'')+'</div>';
}
function setField(k,v){if(v==='other'){S.cust[k]=true}else{S.cust[k]=false;S[k]=parseFloat(v)||0}save();render()}
function setCustom(k,v){S[k]=Math.max(0,parseFloat(v)||0);S.cust[k]=true;save();render()}
function setView(v){view=v;render()}
function donut(parts,base,inc){
  var R=70,C=2*Math.PI*R,cum=0,s='',lab='';
  if(base<=0){s='<circle cx="100" cy="100" r="70" fill="none" stroke="var(--line)" stroke-width="40"/>'}
  else parts.forEach(function(p){
    if(p.v<=0)return;
    var len=p.v/base*C,pct=Math.round(p.v/base*100);
    s+='<circle cx="100" cy="100" r="70" fill="none" stroke="'+p.c+'" stroke-width="40" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-cum)+'" transform="rotate(-90 100 100)"/>';
    if(pct>=5){var a=(cum+len/2)/C*2*Math.PI-Math.PI/2;lab+='<text x="'+(100+R*Math.cos(a))+'" y="'+(100+R*Math.sin(a)+4)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">'+pct+'%</text>'}
    cum+=len;
  });
  return '<svg viewBox="0 0 200 200" role="img" aria-label="Income and spending chart">'+s+lab+'<text x="100" y="94" text-anchor="middle" font-size="13" style="fill:var(--mute)">Income</text><text x="100" y="114" text-anchor="middle" font-size="15" font-weight="800" style="fill:var(--ink)">'+fmt(inc)+'</text></svg>';
}
function chart(n,f,u){
  var inc=S.income,plan=S.loan+S.needs+S.fuel+S.fun,sav=inc-plan,out=n+f+u,parts,base,verdict,bad=false;
  var C={loan:'#7c5cbf',needs:'#0f766e',fuel:'#c27a12',fun:'#d6537a',save:'#2f7fd1'};
  if(view==='plan'){
    parts=[{n:'Loan',v:S.loan,c:C.loan},{n:'Needs',v:S.needs,c:C.needs},{n:'Fuel',v:S.fuel,c:C.fuel},{n:'Fun',v:S.fun,c:C.fun},{n:'Savings',v:Math.max(0,sav),c:C.save}];
    base=Math.max(inc,plan);
    if(!inc&&!plan)verdict='Choose your income and budget above';
    else if(sav<0){verdict='Short by '+fmt(-sav)+' each month';bad=true}else verdict='Left to save: '+fmt(sav);
  }else{
    parts=[{n:'Needs',v:n,c:C.needs},{n:'Fuel',v:f,c:C.fuel},{n:'Fun',v:u,c:C.fun},{n:'Left',v:Math.max(0,inc-out),c:C.save}];
    base=Math.max(inc,out);
    verdict='Spent '+fmt(out)+' so far';
  }
  var h='<section class="card"><h2>Money in vs money out</h2><div class="tabs"><button class="tab'+(view==='plan'?' sel':'')+'" onclick="setView(\'plan\')">Planned</button><button class="tab'+(view==='spent'?' sel':'')+'" onclick="setView(\'spent\')">Spent so far</button></div>';
  h+='<div class="dn">'+donut(parts,base,inc)+'<div class="leg">'+parts.map(function(p){return '<div class="lg"><span class="dot" style="background:'+p.c+'"></span><b>'+p.n+'</b><span>'+fmt(p.v)+' <span class="mute">('+(base>0?Math.round(p.v/base*100):0)+'%)</span></span></div>'}).join('')+'</div></div>';
  return h+'<div class="verdict" style="color:'+(bad?'var(--bad)':'var(--ok)')+'">'+verdict+'</div></section>';
}
function breakdown(c){var t={};c.exp.forEach(function(e){t[e.cat]=(t[e.cat]||0)+e.amt});var k=Object.keys(t).sort(function(a,b){return t[b]-t[a]});if(!k.length)return '';var m=t[k[0]];return '<section class="card"><h2>Where it went</h2>'+k.map(function(n){return '<div class="row"><b>'+icon(n)+' '+esc(n)+'</b><span>'+fmt(t[n])+'</span></div><div class="bar"><i style="width:'+(t[n]/m*100)+'%"></i></div>'}).join('')+'</section>'}
function bar(label,sp,bud){
  var p=bud?Math.min(100,sp/bud*100):0,col=sp>bud?'var(--bad)':p>80?'var(--warn)':'var(--ok)';
  return '<div class="row"><b>'+label+'</b><span class="'+(sp>bud?'over':'')+'">'+fmt(sp)+' / '+fmt(bud)+'</span></div><div class="bar"><i style="width:'+p+'%;background:'+col+'"></i></div>';
}
function render(){
  var cy=cycle(),c=cy.c,n=spent(c,'Needs'),f=spent(c,'Fuel'),u=spent(c,'Fun');
  var total=S.needs+S.fuel+S.fun,used=n+f+u,rem=total-used,day=Math.max(0,rem)/cy.left;
  var status=!total?'Set your budget above':rem<0?'Over budget. Pause non-essentials.':day<150?'Tight. Spend only what you must.':'On track';
  var saveGoal=Math.max(0,S.income-S.loan-total);
  var h='<section class="card" style="margin-top:0"><h2>Your money setup</h2>'+F.map(field).join('')+'</section>';
  h+='<section class="hero"><small>Safe to spend today</small><div class="big">'+fmt(day)+'</div><span class="chip">'+status+'</span><div style="margin-top:12px;font-size:13px;opacity:.85">'+fmt(Math.max(0,rem))+' left this cycle · '+cy.left+' days to next payday</div></section>';
  h+=chart(n,f,u);
  h+='<section class="card"><h2>Add a spend</h2><div class="add"><div class="cats full">'+catGrid()+'</div><input class="full" id="amt" type="number" inputmode="numeric" placeholder="Amount (Rs)"><input class="full" id="note" placeholder="What was it? (optional)"><button class="full" onclick="addExp()">Save spend</button></div></section>';
  h+='<section class="card"><h2>This cycle</h2>'+bar('Needs',n,S.needs)+bar('Fuel &amp; transport',f,S.fuel)+bar('Fun',u,S.fun)+'</section>';
  var cl=[['salary','Salary landed (26th or 27th)'],['loan','Loan paid: '+fmt(S.loan)+' (28th)'],['save','Savings moved out: '+fmt(saveGoal)]];
  h+='<section class="card"><h2>Payday routine</h2>'+cl.map(function(x){return '<label class="chk"><input type="checkbox" '+(c.chk[x[0]]?'checked':'')+' onchange="tick(\''+x[0]+'\',this.checked)"><span>'+x[1]+'</span></label>'}).join('')+'</section>';
  var ep=S.efGoal?Math.min(100,S.ef/S.efGoal*100):0;
  h+='<section class="card"><h2>Emergency fund</h2><div class="row"><b>'+fmt(S.ef)+'</b><span class="mute">goal '+fmt(S.efGoal)+'</span></div><div class="bar"><i style="width:'+ep+'%"></i></div><div class="row mute"><span>Saved so far</span><input style="width:130px;padding:8px" type="number" inputmode="numeric" value="'+(S.ef||'')+'" placeholder="0" onchange="setEf(this.value)"></div><div class="row mute" style="margin-top:8px"><span>My goal</span><input style="width:130px;padding:8px" type="number" inputmode="numeric" value="'+(S.efGoal||'')+'" placeholder="0" onchange="setGoal(this.value)"></div></section>';
  var list=c.exp.slice().reverse().slice(0,12);h+=breakdown(c);
  h+='<section class="card"><h2>Recent spends</h2>'+(list.length?list.map(function(e){return '<div class="item"><span>'+icon(e.cat)+' '+esc(e.note||e.cat)+'<br><span class="mute">'+e.cat+' · '+e.date+'</span></span><span>'+fmt(e.amt)+'<button class="x" aria-label="Delete" onclick="del('+e.id+')">×</button></span></div>'}).join(''):'<div class="mute">Nothing logged yet. Add your first spend above.</div>')+'</section>';
  document.getElementById('app').innerHTML=h;
}
function addExp(){
  var a=parseFloat(document.getElementById('amt').value);
  if(!(a>0)){document.getElementById('amt').focus();return}
  var cy=cycle(),t=new Date();
  cy.c.exp.push({id:Date.now(),amt:a,cat:CATS[selCat][0],grp:CATS[selCat][2],note:document.getElementById('note').value.trim(),date:t.getDate()+'/'+(t.getMonth()+1)});
  save();render();
}
function del(id){var c=cycle().c;c.exp=c.exp.filter(function(e){return e.id!==id});save();render()}
function tick(k,v){cycle().c.chk[k]=v;save();render()}
function setEf(v){S.ef=Math.max(0,parseFloat(v)||0);save();render()}
function setGoal(v){S.efGoal=Math.max(0,parseFloat(v)||0);save();render()}
render();
</script>
</body>
</html>
